[package]
name = "launcher"
version = "0.1.0"
edition = "2024"
description = "Self-updating launcher for games and apps published as GitHub releases"
license = "MIT"

[dependencies]
dirs = "7"
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
flate2 = "1.1"
self-replace = "1.5"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = "0.4"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
