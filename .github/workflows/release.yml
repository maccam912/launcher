# Push a tag like v0.2.0 (matching the version in Cargo.toml) to publish a
# release. Running launchers pick it up and replace themselves with the bare
# `launcher-<os>-<arch>` executables; the other files are for first installs.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: macos }
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, name: linux-aarch64 }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        shell: bash
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: scripts/package-macos.sh && rm -rf dist/Launcher.app
      - name: Package (Linux)
        if: startsWith(matrix.name, 'linux')
        run: |
          cargo build --release --locked
          mkdir dist && cp target/release/launcher "dist/launcher-${{ matrix.name }}"
      - name: Package (Windows)
        if: matrix.name == 'windows-x86_64'
        shell: bash
        run: |
          cargo build --release --locked
          mkdir dist && cp target/release/launcher.exe dist/launcher-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Launcher $GITHUB_REF_NAME" --generate-notes
